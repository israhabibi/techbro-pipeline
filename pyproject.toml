[project]
name = "techbro-pipeline"
version = "0.2.0"
description = "A daily technology timeline pipeline with a FastAPI dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.4,<4",
  "httpx>=0.27,<1",
  "tzdata>=2025.2",
  "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
online-tts = ["edge-tts>=7.2.3,<8"]
analysis = ["pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.scripts]
techbro = "techbro_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "pip-audit>=2.9,<3",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techbro_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S307"]

[tool.coverage.run]
source = ["techbro_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
