tls:
  certificates:
    - certFile: /letsencrypt/fullchain.pem
      keyFile: /letsencrypt/privkey.pem
    - certFile: /letsencrypt/snbp-fullchain.pem
      keyFile: /letsencrypt/snbp-privkey.pem

http:
  services:
    digest:
      loadBalancer:
        servers:
          - url: "http://digest-web:8000"
    pihole:
      loadBalancer:
        servers:
          - url: "http://pihole:80"
    homepage:
      loadBalancer:
        servers:
          - url: "http://homepage:3000"
    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://uptime-kuma:3001"
    ninerouter:
      loadBalancer:
        servers:
          - url: "http://9router:20128"
  routers:
    digest-domain:
      rule: "Host(`airflow.my.id`)"
      entryPoints:
        - websecure
      service: digest
      priority: 50
    pihole-domain:
      rule: "Host(`pihole.airflow.my.id`)"
      entryPoints:
        - websecure
      service: pihole
      priority: 50
    home-domain:
      rule: "Host(`home.airflow.my.id`)"
      entryPoints:
        - websecure
      service: homepage
      priority: 50
    uptime-domain:
      rule: "Host(`uptime.airflow.my.id`)"
      entryPoints:
        - websecure
      service: uptime-kuma
      priority: 50
    digest-ip:
      rule: "Host(`35.209.136.180`)"
      entryPoints:
        - web
      priority: 1
      service: digest
    digest-redirect:
      rule: "Host(`airflow.my.id`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: digest
      priority: 50
    pihole-redirect:
      rule: "Host(`pihole.airflow.my.id`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: pihole
      priority: 50
    home-redirect:
      rule: "Host(`home.airflow.my.id`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: homepage
      priority: 50
    uptime-redirect:
      rule: "Host(`uptime.airflow.my.id`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      service: uptime-kuma
      priority: 50
    chat-redirect:
      rule: "Host(`chat.airflow.my.id`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      priority: 1
      service: noop@internal
    traefik-dashboard:
      rule: "Host(`traefik.airflow.my.id`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - traefik-auth
      priority: 50
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
    traefik-auth:
      basicAuth:
        users:
          - "admin:$2b$12$FapqLnhqe3wNJRkv/fysoeXbZJoiEBKwlZr8S0LBiZ1tSsA07jF7S"
