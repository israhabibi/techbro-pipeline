services:
  digest:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: digest-web
    environment:
      DATA_DIR: /data
      DATASET_DIR: /dataset
      ADACODE_API_KEY: ${ADACODE_API_KEY:-}
      ADACODE_MODEL: ${ADACODE_MODEL:-adacode-2.0}
      ENABLE_VIDEO_RENDER: ${ENABLE_VIDEO_RENDER:-false}
      TTS_BACKEND: local
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    volumes:
      - ./data:/data
      - ./dataset:/dataset:ro
    ports:
      - "127.0.0.1:${TECHBRO_PORT:-8000}:8000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
